[project]
name = "moru"
version = "0.1.0"
description = "Moru is a local, conversational image-generation desktop app."
readme = "README.md"
authors = [
    { name = "Neuwcodebox", email = "neuwgmbox@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = ["pywebview>=6,<7", "pillow>=11,<13", "pyjwt[crypto]>=2.10,<3"]

[project.optional-dependencies]
inference = [
  "llama-cpp-python==0.3.36",
  "torch>=2.8,<2.9",
  "torchvision>=0.23,<0.24",
  "numpy>=1.26,<3",
  "einops>=0.8,<1",
  "transformers>=4.57,<5",
  "sentencepiece>=0.2,<1",
  "safetensors>=0.6,<1",
  "scipy>=1.15,<2",
  "psutil>=7,<8",
  "pyyaml>=6,<7",
  "tqdm>=4.67,<5",
  "torchsde>=0.2.6,<0.3",
  "comfy-kitchen==0.2.37",
  "comfy-aimdo==0.5.5",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
llama-cpp-python = [
  { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.36-cu124/llama_cpp_python-0.3.36-py3-none-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "pyinstaller>=6.15,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: requires real models and a CUDA GPU"]
addopts = "-m 'not smoke'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
moru = "moru:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
